<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="encabezado">
        <h1 class="encabezado__titulo">EL PODER EL CSS3</h1>
        <p class="encabezado__desc">Flash y su disfrash - Sergio Velandia.</p>
    </header>

    <main class="galeria">


        
        <article class="card card--flash">
            <div class="card__media">
                <img src="imagenes/antiflash.jpg" alt="Rayo dorado sobre fondo azul que representa a Flash">
                <span class="badge">&#128293; Velocidad</span>
            </div>
            <div class="card__body">
                <p class="card__tipo">Héroe</p>
                <h2 class="card__nombre">Flash</h2>
                <p class="card__desc">Un personaje capaz de moverse a velocidades extraordinarias.</p>
                <div class="poder">
                    <span class="poder__icono" aria-hidden="true">&#9889;</span>
                    <div class="poder__texto">
                        <strong>Poder especial</strong>
                        <span>Velocidad extrema</span>
                    </div>
                </div>
                <button class="btn" type="button">Activar poder</button>
            </div>
        </article>
    </main>

</body>

</html>
